hub_id: hub-CAMBIAME        # genera uno único por hogar y no lo cambies
discovery:
  interval_seconds: 60
inference:
  detector: person_yolo     # "person_yolo", "person_pose" (cajas + pose, necesario para caídas) o "stub"
  sample_fps: 2
  confidence: 0.4
  stream: substream         # "substream" ahorra CPU; "main" para más resolución
  fall:
    enabled: false          # true para emitir fall_detected/update/resolved (requiere detector: person_pose)
    min_score: 0.3          # score mínimo para emitir; bajo a propósito, quien filtra es AWS
  identity:
    enabled: false          # true para etiquetar los fall_* con la persona (requiere fall.enabled)
    match_threshold: 0.4    # similitud mínima contra /data/faces/<person_id>/ para etiquetar
uplink:
  enabled: false            # true para publicar los eventos en AWS IoT Core
  topic_prefix: vita/hub    # NO lo cambies por hogar: la policy de IoT lo lleva fijo,
                            # y con otro valor el broker descarta los publish en silencio
# Con enabled: true hacen falta además estas variables de entorno:
#   VITAHUB_IOT_ENDPOINT  (lo imprime provision-hub.sh del repo de arquitectura)
#   VITAHUB_IOT_CA / VITAHUB_IOT_CERT / VITAHUB_IOT_KEY  (por defecto en /data/certs/)
live:
  enabled: false            # true para el vídeo en directo desde la app (requiere uplink.enabled)
  max_viewers: 3            # visores simultáneos como máximo (1-10); cada uno es un flujo de subida
  max_fps: 15               # fps máximos del directo
  region: eu-west-1
  session_keys: {}          # kid -> clave pública PEM; la imprime scripts/live-public-key.sh
# Con enabled: true hacen falta además estas variables de entorno:
#   VITAHUB_IOT_CREDENTIALS_ENDPOINT, VITAHUB_LIVE_ROLE_ALIAS, VITAHUB_LIVE_CHANNEL_PREFIX
#   (las imprime provision-hub.sh del repo de arquitectura)
clips:
  enabled: false            # true para subir a S3 un clip de vídeo ante una caída con riesgo
                            # (requiere uplink.enabled e inference.fall.enabled). Actívalo solo
                            # DESPUÉS de registrar el consentimiento de clips en el panel del técnico
  cameras: []               # ids de cámara con clips; opt-in por cámara: deja fuera, por ejemplo,
                            # la cámara del baño
  region: eu-west-1
# Con enabled: true hacen falta además estas variables de entorno:
#   VITAHUB_CLIPS_BUCKET, VITAHUB_CLIPS_ROLE_ALIAS
#   (las imprime provision-hub.sh del repo de arquitectura)
#   y VITAHUB_IOT_CREDENTIALS_ENDPOINT, la misma que usa el directo
cameras: []                 # se autopobla al descubrir; editable a mano
# Nota: tras el primer descubrimiento el hub reescribe este fichero (sección cameras);
# los comentarios pueden perderse. Edita a mano solo con el hub parado.
# La credencial NO va aquí: usa VITAHUB_ONVIF_USER / VITAHUB_ONVIF_PASSWORD
