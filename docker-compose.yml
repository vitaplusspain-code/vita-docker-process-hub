services:
  hub:
    build: .
    image: vitahub:local
    restart: unless-stopped
    network_mode: host          # necesario para el multicast ONVIF de descubrimiento
    # Margen por encima del peor caso de apagado antes de que Docker mande
    # SIGKILL: 20s de cámaras + 5s del directo + 5s de los hilos de clips
    # (_CAMERA_SHUTDOWN_DEADLINE_S, _LIVE_SHUTDOWN_DEADLINE_S y
    # _CLIPS_SHUTDOWN_DEADLINE_S en app.py, se suman porque van en serie) más
    # el cierre del control HTTP y del sink. 45s dejan 15s de margen. El valor
    # por defecto de Docker (10s) se queda corto.
    stop_grace_period: 45s
    # Tope de logs: el driver json-file por defecto NO limita el tamaño del
    # stdout de eventos, y este aparato está pensado para correr años
    # desatendido. Además, desde este slice cada petición rechazada a
    # POST /rescan (alcanzable sin credencial desde la WiFi del hogar)
    # escribe una línea de log: sin tope, un vecino tocando el puerto puede
    # hacer crecer los logs sin límite. 5 ficheros de 10 MB (50 MB total) es
    # margen de sobra para meses de operación normal.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      VITAHUB_ONVIF_USER: ${VITAHUB_ONVIF_USER:?falta usuario ONVIF}
      VITAHUB_ONVIF_PASSWORD: ${VITAHUB_ONVIF_PASSWORD:?falta contraseña ONVIF}
      VITAHUB_LOG_LEVEL: ${VITAHUB_LOG_LEVEL:-INFO}
      # Sin token, el endpoint de control no abre puerto (queda solo el rescan periódico).
      VITAHUB_ADMIN_TOKEN: ${VITAHUB_ADMIN_TOKEN:-}
      VITAHUB_ADMIN_PORT: ${VITAHUB_ADMIN_PORT:-8787}
      # Vacío por defecto: solo es obligatorio con uplink.enabled: true, y de
      # eso ya se queja load_config con un mensaje que dice qué falta.
      VITAHUB_IOT_ENDPOINT: ${VITAHUB_IOT_ENDPOINT:-}
      VITAHUB_IOT_CA: ${VITAHUB_IOT_CA:-/data/certs/AmazonRootCA1.pem}
      VITAHUB_IOT_CERT: ${VITAHUB_IOT_CERT:-/data/certs/certificate.pem.crt}
      VITAHUB_IOT_KEY: ${VITAHUB_IOT_KEY:-/data/certs/private.pem.key}
      # Vacías por defecto: solo son obligatorias con live.enabled: true, y de
      # eso ya se queja load_config con un mensaje que dice qué falta.
      VITAHUB_IOT_CREDENTIALS_ENDPOINT: ${VITAHUB_IOT_CREDENTIALS_ENDPOINT:-}
      VITAHUB_LIVE_ROLE_ALIAS: ${VITAHUB_LIVE_ROLE_ALIAS:-}
      VITAHUB_LIVE_CHANNEL_PREFIX: ${VITAHUB_LIVE_CHANNEL_PREFIX:-}
      # Vacías por defecto: solo son obligatorias con clips.enabled: true, y de
      # eso ya se queja load_config con un mensaje que dice qué falta.
      VITAHUB_CLIPS_BUCKET: ${VITAHUB_CLIPS_BUCKET:-}
      VITAHUB_CLIPS_ROLE_ALIAS: ${VITAHUB_CLIPS_ROLE_ALIAS:-}
    volumes:
      - ./data:/data
