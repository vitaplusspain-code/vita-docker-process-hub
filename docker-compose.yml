services:
  webcam-publisher:
    build: ./services/webcam-publisher
    devices:
      - /dev/video0:/dev/video0
    depends_on:
      - mediamtx
    restart: always

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
    restart: always

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt-jetson
    shm_size: "256mb"
    volumes:
      - ./config/frigate/frigate.yml:/config/config.yml:ro
      - frigate-media:/media/frigate
    ports:
      - "5000:5000"
    depends_on:
      - mediamtx
      - mosquitto
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: always

  event-engine:
    build: ./services/event-engine
    environment:
      RULES_CONFIG_PATH: /config/hub/rules.yaml
      EVENT_DB_PATH: /data/events.db
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - ./config/hub/rules.yaml:/config/hub/rules.yaml:ro
      - event-engine-data:/data
    depends_on:
      - mosquitto
    restart: always

volumes:
  frigate-media:
  event-engine-data:
